<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд розпоряджень / Task Orders Dashboard</title>
    <style>
        :root { --primary: #0366d6; --bg: #f6f8fa; --border: #e1e4e8; --text: #24292e; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1250px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .lang-switcher span { font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.2s; }
        .lang-switcher span.active { opacity: 1; }
        
        .card { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(27,31,35,0.04); }
        .admin-panel { display: none; border-left: 4px solid #2ea44f; } 
        
        h2, h3 { margin-top: 0; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .bases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; gap: 10px; align-items: center; }
        .full-width { grid-column: span 2; }

        input[type="text"], input[type="date"], select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; padding: 8px 12px; border-radius: 4px; }
        button:hover { background-color: #005cc5; }
        .btn-outline { background-color: white; color: var(--primary); border: 1px solid var(--primary); }
        .btn-outline:hover { background-color: #f0f8ff; }
        .btn-remove { background-color: #d73a49; color: white; padding: 4px 8px; font-size: 12px; float: right; }
        .btn-remove:hover { background-color: #cb2431; }
        
        .polygon-block { background: #fafbfc; border: 1px solid #e1e4e8; border-left: 4px solid var(--primary); padding: 15px; border-radius: 4px; margin-bottom: 15px; }
        .dynamic-fields { display: none; background: #fff; padding: 15px; border-radius: 4px; border: 1px solid #e1e4e8; margin-top: 15px; }
        .dynamic-fields.active { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .multi-select { position: relative; width: 100%; user-select: none; }
        .select-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .select-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 4px; z-index: 100; max-height: 200px; overflow-y: auto; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 4px; }
        .select-dropdown.open { display: block; }
        .checkbox-group { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; border-radius: 4px; background: #fff; }
        .checkbox-item { padding: 8px 12px; border-bottom: 1px solid #eee; margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
        .checkbox-item:hover { background: #f6f8fa; }
        .checkbox-item:last-child { border-bottom: none; }
        .checkbox-item input { margin: 0; cursor: pointer; }
        .lbl-bold { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        th { background-color: var(--bg); font-weight: 600; }
        .delete-btn { background-color: #d73a49; padding: 4px 8px; font-size: 12px; }
        
        .admin-lock { cursor: pointer; font-size: 20px; opacity: 0.7; }
        .status { font-size: 12px; color: #6a737d; margin-top: 10px; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-weight: bold; background: #e1e4e8; margin-bottom: 4px; margin-right: 4px;}
        .tag.demining { background: #ffdce0; color: #86181d; }
        .tag.nts { background: #dbedff; color: #0366d6; }
        .tag.eore { background: #dcffe4; color: #176f2c; }
        .date-cell { font-family: monospace; font-size: 13px; white-space: nowrap; }
        .poly-list-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
        .poly-list-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="t_mainTitle">Дашборд розпоряджень</h2>
        <div class="controls">
            <span class="admin-lock" onclick="toggleAdmin()" title="Увійти як Адмін">🔒</span>
            <div class="lang-switcher">
                <span id="lang_uk" onclick="setLanguage('uk')" class="active">🇺🇦</span>
                <span id="lang_en" onclick="setLanguage('en')">🇬🇧</span>
            </div>
        </div>
    </div>

    <div id="adminForms" class="admin-panel">
        
        <div class="bases-grid">
            <div class="card" style="margin-bottom: 0;">
                <h3 id="t_addPolygonTitle">База полігонів</h3>
                <div class="form-group">
                    <input type="text" id="newPolygonInput" placeholder="Назва полігону">
                    <button id="t_addPolygonBtn" onclick="addPolygon()">Додати</button>
                </div>
            </div>
            
            <div class="card" style="margin-bottom: 0;">
                <h3 id="t_addMethodTitle">База методів розмінування</h3>
                <div class="form-group">
                    <input type="text" id="newMethodInput" placeholder="Власний тип розмінування">
                    <button id="t_addMethodBtn" onclick="addCustomMethod()">Додати</button>
                </div>
            </div>

            <div class="card" style="margin-bottom: 0;">
                <h3 id="t_addCadastreTitle">База кадастрів</h3>
                <div class="form-group">
                    <input type="text" id="newCadastreInput" placeholder="Кадастровий номер">
                    <button id="t_addCadastreBtn" onclick="addCadastre()">Додати</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 id="t_newOrderTitle">Нове розпорядження (ТО)</h3>
            
            <div class="form-grid">
                <input type="text" id="orderNumber" placeholder="Номер розпорядження" required>
                <select id="orderRegion">
                    <option value="" disabled selected id="t_optRegion">Оберіть область...</option>
                    <option value="kharkiv" id="t_regKh">Харківська область</option>
                    <option value="mykolaiv" id="t_regMyk">Миколаївська область</option>
                </select>
                
                <div class="form-group full-width" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <input type="date" id="startDate" required onchange="calculateEndDate()" title="Дата початку">
                    <input type="date" id="endDate" required title="Кінцева дата">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h4 style="margin: 0;" id="t_lblPolygonsInTO">Полігони в цьому розпорядженні:</h4>
                <button type="button" class="btn-outline" onclick="addPolygonItemBlock()" id="t_btnAddPolygonToTO">+ Додати полігон до ТО</button>
            </div>

            <div id="polygonItemsContainer"></div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <button id="t_addOrderBtn" onclick="addOrder()" style="width: 100%;">Зберегти розпорядження</button>
        </div>
    </div>

    <div class="card">
        <h3 id="t_actualOrdersTitle">Актуальні розпорядження</h3>
        <table id="ordersTable">
            <thead>
                <tr>
                    <th id="t_thNum">ТО / Регіон</th>
                    <th id="t_thPeriod">Період</th>
                    <th id="t_thPolDetails">Полігони та їх деталі</th>
                    <th id="t_thAction" class="admin-only" style="display:none;">Дія</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="status" id="syncStatus">Завантаження даних...</div>
    </div>
</div>

<script>
    const GITHUB_USER = 'babmlbee'; 
    const GITHUB_REPO = 'polygon-dashboard';  
    const FILE_PATH = 'data.json';

    let currentLang = localStorage.getItem('language') || 'uk';
    let polygons = [];
    let customMethods = [];
    let cadastres = [];
    let orders = [];
    let isAdmin = !!localStorage.getItem('gh_token');

    const translations = {
        uk: {
            mainTitle: "Дашборд розпоряджень", addPolygonTitle: "База полігонів", polygonPlaceholder: "Назва полігону", addPolygonBtn: "Додати",
            addMethodTitle: "База методів", methodPlaceholder: "Власний тип", addMethodBtn: "Додати",
            addCadastreTitle: "База кадастрів", cadastrePlaceholder: "Кадастровий номер", addCadastreBtn: "Додати",
            newOrderTitle: "Нове розпорядження (ТО)", optRegion: "Оберіть область...", regKh: "Харківська область", regMyk: "Миколаївська область",
            optType: "Оберіть тип...", selectDefault: "Оберіть полігон...", lblPolygonsInTO: "Полігони в цьому розпорядженні:", btnAddPolygonToTO: "+ Додати полігон до ТО",
            lblSelectMethods: "Оберіть методи розмінування...", lblSelected: "Обрано:",
            lblSelectCadastres: "Оберіть кадастри:", lblReportSent: "Звіт надіслано",
            typeDemining: "Розмінування", typeNts: "НТО", typeEore: "ІНРМ",
            optSubNts: "Оберіть підтип НТО...", ntsIn: "Первинне", ntsRe: "Первинне НТО", ntsDemarc: "НТО З метою встановлення маркування", ntsTarget: "Цільове НТО",
            demTs: "Технічне обстеження", demMc: "Розмінування в ручну", demBac: "ОРВБД", demMdd: "Застосування кінологічних розрахунків МРС", demMech: "Розмінування з використанням машин і механізмів",
            orderNumberPlaceholder: "Номер розпорядження", imsmaPlaceholder: "IMSMA ID", addOrderBtn: "Зберегти розпорядження", actualOrdersTitle: "Актуальні розпорядження", 
            thNum: "ТО / Регіон", thPeriod: "Період", thPolDetails: "Полігони та їх деталі", thAction: "Дія", deleteBtn: "Видалити",
            statusLoaded: "✅ Дані завантажено", statusSaving: "⏳ Збереження...", statusSaved: "✅ Збережено",
            lblImsma: "IMSMA ID", lblType: "Методи", lblSubtype: "Підтип", lblStatus: "Статус звіту",
            reportYes: "✅ Надіслано", reportNo: "⏳ Очікується", lblCads: "Кадастри",
            dateWarning: "УВАГА: Наступний місяць має іншу кількість днів. Кінцева дата зміщена. Перевірте її!"
        },
        en: {
            mainTitle: "Task Orders Dashboard", addPolygonTitle: "Polygons Base", polygonPlaceholder: "Polygon Name", addPolygonBtn: "Add",
            addMethodTitle: "Methods Base", methodPlaceholder: "Custom method", addMethodBtn: "Add",
            addCadastreTitle: "Cadastres Base", cadastrePlaceholder: "Cadastral number", addCadastreBtn: "Add",
            newOrderTitle: "New Task Order", optRegion: "Select Region...", regKh: "Kharkiv Region", regMyk: "Mykolaiv Region",
            optType: "Select Type...", selectDefault: "Select Polygon...", lblPolygonsInTO: "Polygons in this TO:", btnAddPolygonToTO: "+ Add Polygon to TO",
            lblSelectMethods: "Select demining methods...", lblSelected: "Selected:",
            lblSelectCadastres: "Select cadastres:", lblReportSent: "Report sent",
            typeDemining: "Demining", typeNts: "NTS", typeEore: "EORE",
            optSubNts: "Select NTS Subtype...", ntsIn: "In-NTS", ntsRe: "Re-NTS", ntsDemarc: "Demarcation NTS", ntsTarget: "Targeted NTS",
            demTs: "Technical survey", demMc: "Manual clearance", demBac: "BAC", demMdd: "MDD", demMech: "Mechanical clearance",
            orderNumberPlaceholder: "Task Order Number", imsmaPlaceholder: "IMSMA ID", addOrderBtn: "Save Task Order", actualOrdersTitle: "Current Task Orders", 
            thNum: "TO / Region", thPeriod: "Period", thPolDetails: "Polygons & Details", thAction: "Action", deleteBtn: "Delete",
            statusLoaded: "✅ Data loaded", statusSaving: "⏳ Saving...", statusSaved: "✅ Saved",
            lblImsma: "IMSMA ID", lblType: "Methods", lblSubtype: "Subtype", lblStatus: "Report Status",
            reportYes: "✅ Sent", reportNo: "⏳ Pending", lblCads: "Cadastres",
            dateWarning: "WARNING: The next month has a different number of days. The end date was adjusted!"
        }
    };

    function setLanguage(lang) {
        currentLang = lang; localStorage.setItem('language', lang);
        const t = translations[lang];
        
        document.getElementById('lang_uk').className = lang === 'uk' ? 'active' : ''; document.getElementById('lang_en').className = lang === 'en' ? 'active' : '';
        
        document.getElementById('t_mainTitle').innerText = t.mainTitle;
        document.getElementById('t_addPolygonTitle').innerText = t.addPolygonTitle; document.getElementById('newPolygonInput').placeholder = t.polygonPlaceholder; document.getElementById('t_addPolygonBtn').innerText = t.addPolygonBtn;
        document.getElementById('t_addMethodTitle').innerText = t.addMethodTitle; document.getElementById('newMethodInput').placeholder = t.methodPlaceholder; document.getElementById('t_addMethodBtn').innerText = t.addMethodBtn;
        document.getElementById('t_addCadastreTitle').innerText = t.addCadastreTitle; document.getElementById('newCadastreInput').placeholder = t.cadastrePlaceholder; document.getElementById('t_addCadastreBtn').innerText = t.addCadastreBtn;
        document.getElementById('t_newOrderTitle').innerText = t.newOrderTitle; document.getElementById('t_optRegion').innerText = t.optRegion; document.getElementById('t_regKh').innerText = t.regKh; document.getElementById('t_regMyk').innerText = t.regMyk;
        document.getElementById('t_lblPolygonsInTO').innerText = t.lblPolygonsInTO; document.getElementById('t_btnAddPolygonToTO').innerText = t.btnAddPolygonToTO; document.getElementById('orderNumber').placeholder = t.orderNumberPlaceholder; document.getElementById('t_addOrderBtn').innerText = t.addOrderBtn;
        document.getElementById('t_actualOrdersTitle').innerText = t.actualOrdersTitle; document.getElementById('t_thNum').innerText = t.thNum; document.getElementById('t_thPeriod').innerText = t.thPeriod; document.getElementById('t_thPolDetails').innerText = t.thPolDetails; document.getElementById('t_thAction').innerText = t.thAction;
        
        document.getElementById('polygonItemsContainer').innerHTML = ''; 
        renderOrders();
    }

    async function loadData() {
        try {
            const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`);
            if (response.ok) {
                const data = await response.json();
                polygons = data.polygons || []; customMethods = data.customMethods || []; cadastres = data.cadastres || []; orders = data.orders || [];
                document.getElementById('syncStatus').innerText = translations[currentLang].statusLoaded;
            } else { document.getElementById('syncStatus').innerText = "База порожня"; }
        } catch (e) { console.error(e); }
        renderOrders(); updateAdminUI();
    }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

    async function saveToGitHub() {
        const token = localStorage.getItem('gh_token'); if (!token) return;
        document.getElementById('syncStatus').innerText = translations[currentLang].statusSaving;
        const contentBase64 = utf8_to_b64(JSON.stringify({ polygons, customMethods, cadastres, orders }, null, 2));
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

        try {
            let sha = null; const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            if (getRes.ok) { const fileData = await getRes.json(); sha = fileData.sha; }
            const body = { message: "Оновлення бази дашборду", content: contentBase64 }; if (sha) body.sha = sha;
            const putRes = await fetch(apiUrl, { method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (putRes.ok) { document.getElementById('syncStatus').innerText = translations[currentLang].statusSaved; } 
            else { alert("Помилка збереження. Перевірте токен."); localStorage.removeItem('gh_token'); isAdmin = false; updateAdminUI(); }
        } catch (e) { console.error(e); }
    }

    function toggleAdmin() {
        if (isAdmin) { if(confirm("Вийти з режиму Адміністратора?")) { localStorage.removeItem('gh_token'); isAdmin = false; updateAdminUI(); } } 
        else { const token = prompt("Введіть ваш GitHub Personal Access Token:"); if (token) { localStorage.setItem('gh_token', token.trim()); isAdmin = true; updateAdminUI(); } }
    }

    function updateAdminUI() {
        document.getElementById('adminForms').style.display = isAdmin ? 'block' : 'none';
        const actionHeaders = document.querySelectorAll('.admin-only'); actionHeaders.forEach(el => el.style.display = isAdmin ? 'table-cell' : 'none');
        renderOrders();
    }

    function addPolygon() {
        const name = document.getElementById('newPolygonInput').value.trim();
        if (name && !polygons.includes(name)) { polygons.push(name); document.getElementById('newPolygonInput').value = ''; saveToGitHub(); }
    }
    function addCustomMethod() {
        const name = document.getElementById('newMethodInput').value.trim();
        if (name && !customMethods.includes(name)) { customMethods.push(name); document.getElementById('newMethodInput').value = ''; saveToGitHub(); }
    }
    function addCadastre() {
        const name = document.getElementById('newCadastreInput').value.trim();
        if (name && !cadastres.includes(name)) { cadastres.push(name); document.getElementById('newCadastreInput').value = ''; saveToGitHub(); }
    }

    function calculateEndDate() {
        const startInput = document.getElementById('startDate').value; if (!startInput) return;
        let start = new Date(startInput); let expectedMonth = (start.getMonth() + 1) % 12; let end = new Date(start); end.setMonth(end.getMonth() + 1);
        if (end.getMonth() !== expectedMonth) { end = new Date(start.getFullYear(), start.getMonth() + 2, 0); alert(translations[currentLang].dateWarning); }
        let y = end.getFullYear(); let m = String(end.getMonth() + 1).padStart(2, '0'); let d = String(end.getDate()).padStart(2, '0'); document.getElementById('endDate').value = `${y}-${m}-${d}`;
    }

    document.addEventListener('click', function(e) { if (!e.target.closest('.multi-select')) { document.querySelectorAll('.select-dropdown').forEach(d => d.classList.remove('open')); } });
    function toggleMultiSelect(id) { document.getElementById(id).classList.toggle('open'); }
    function updateMethodLabel(blockId) {
        const t = translations[currentLang]; const container = document.getElementById('dd_' + blockId);
        const checked = container.querySelectorAll('input:checked'); const label = document.getElementById('lbl_' + blockId);
        if (checked.length === 0) label.innerText = t.lblSelectMethods; else if (checked.length === 1) label.innerText = checked[0].parentElement.textContent.trim(); else label.innerText = `${t.lblSelected} ${checked.length}`;
    }

    function toggleNtsSub(blockId) {
        const block = document.getElementById(blockId);
        const sub = block.querySelector('.item-nts-sub').value;
        const cadGroup = block.querySelector('.item-cadastres-group');
        if(sub === 'targeted') cadGroup.style.display = 'block'; else cadGroup.style.display = 'none';
    }

    function toggleItemFields(blockId) {
        const block = document.getElementById(blockId);
        const type = block.querySelector('.item-type-select').value;
        const demFields = block.querySelector('.item-demining-fields');
        const ntsFields = block.querySelector('.item-nts-fields');
        demFields.classList.remove('active'); ntsFields.classList.remove('active');
        if(type === 'demining') demFields.classList.add('active');
        if(type === 'nts') { ntsFields.classList.add('active'); toggleNtsSub(blockId); }
    }

    function addPolygonItemBlock() {
        const t = translations[currentLang]; const blockId = 'poly_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        let polOpts = `<option value="" disabled selected>${t.selectDefault}</option>`; polygons.forEach(p => polOpts += `<option value="${p}">${p}</option>`);
        let methodOpts = '';
        const baseMethods = [ {id:'ts', l:t.demTs}, {id:'mc', l:t.demMc}, {id:'bac', l:t.demBac}, {id:'mdd', l:t.demMdd}, {id:'mech', l:t.demMech} ];
        baseMethods.forEach(m => methodOpts += `<label class="checkbox-item"><input type="checkbox" value="${m.id}" onchange="updateMethodLabel('${blockId}')"> <span style="margin:0">${m.l}</span></label>`);
        customMethods.forEach(m => methodOpts += `<label class="checkbox-item"><input type="checkbox" value="${m}" onchange="updateMethodLabel('${blockId}')"> <span style="margin:0">${m}</span></label>`);
        
        let cadOpts = '';
        cadastres.forEach(c => cadOpts += `<label class="checkbox-item"><input type="checkbox" value="${c}"> <span style="margin:0">${c}</span></label>`);

        const html = `
            <div class="polygon-block" id="${blockId}">
                <button type="button" class="btn-remove" onclick="document.getElementById('${blockId}').remove()">X</button>
                <div class="form-grid">
                    <select class="item-poly-select">${polOpts}</select>
                    <select class="item-type-select" onchange="toggleItemFields('${blockId}')">
                        <option value="" disabled selected>${t.optType}</option>
                        <option value="demining">${t.typeDemining}</option>
                        <option value="nts">${t.typeNts}</option>
                        <option value="eore">${t.typeEore}</option>
                    </select>
                </div>
                
                <div class="item-demining-fields dynamic-fields">
                    <input type="text" class="item-imsma" placeholder="${t.imsmaPlaceholder}">
                    <div class="multi-select">
                        <div class="select-btn" onclick="toggleMultiSelect('dd_${blockId}')"><span id="lbl_${blockId}">${t.lblSelectMethods}</span> <span>▼</span></div>
                        <div class="select-dropdown item-methods-group" id="dd_${blockId}">${methodOpts}</div>
                    </div>
                </div>
                
                <div class="item-nts-fields dynamic-fields">
                    <select class="item-nts-sub" onchange="toggleNtsSub('${blockId}')">
                        <option value="" disabled selected>${t.optSubNts}</option>
                        <option value="in_nts">${t.ntsIn}</option>
                        <option value="re_nts">${t.ntsRe}</option>
                        <option value="demarcation">${t.ntsDemarc}</option>
                        <option value="targeted">${t.ntsTarget}</option>
                    </select>
                    
                    <label class="checkbox-item" style="border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; height: 35px; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start;">
                        <input type="checkbox" class="item-nts-report"> <span style="margin-left: 8px;">${t.lblReportSent}</span>
                    </label>

                    <div class="item-cadastres-group full-width" style="display:none; margin-top: 10px;">
                        <label class="lbl-bold">${t.lblSelectCadastres}</label>
                        <div class="checkbox-group" id="cadastres_${blockId}" style="max-height: 120px;">${cadOpts}</div>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('polygonItemsContainer').insertAdjacentHTML('beforeend', html);
    }

    function addOrder() {
        const number = document.getElementById('orderNumber').value.trim(); const region = document.getElementById('orderRegion').value;
        const startDate = document.getElementById('startDate').value; const endDate = document.getElementById('endDate').value;
        const blocks = document.querySelectorAll('.polygon-block');
        
        if (!number || !region || !startDate || !endDate) { alert("Заповніть номер ТО, область та дати!"); return; }
        if (blocks.length === 0) { alert("Додайте хоча б один полігон до розпорядження!"); return; }

        let items = []; let validationError = false;
        blocks.forEach(block => {
            const poly = block.querySelector('.item-poly-select').value; const type = block.querySelector('.item-type-select').value;
            if (!poly || !type) { validationError = true; return; }
            let item = { polygon: poly, type: type };
            if (type === 'demining') {
                item.imsma = block.querySelector('.item-imsma').value.trim();
                item.deminingTypes = Array.from(block.querySelectorAll('.item-methods-group input:checked')).map(cb => cb.value);
            } else if (type === 'nts') {
                item.ntsSubType = block.querySelector('.item-nts-sub').value;
                item.ntsReportSent = block.querySelector('.item-nts-report').checked;
                if(item.ntsSubType === 'targeted') {
                    item.cadastres = Array.from(block.querySelectorAll('.item-cadastres-group input:checked')).map(cb => cb.value);
                }
            }
            items.push(item);
        });

        if (validationError) { alert("В усіх блоках полігонів мають бути обрані назва полігону та тип!"); return; }

        orders.push({ number, region, startDate, endDate, items });
        document.getElementById('orderNumber').value = ''; document.getElementById('orderRegion').value = ''; document.getElementById('startDate').value = ''; document.getElementById('endDate').value = ''; document.getElementById('polygonItemsContainer').innerHTML = '';
        renderOrders(); saveToGitHub();
    }

    function formatD(dStr) { if(!dStr) return ''; const p = dStr.split('-'); return `${p[2]}.${p[1]}.${p[0]}`; }

    function renderOrders() {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        const sorted = [...orders].sort((a, b) => new Date(b.startDate || b.date) - new Date(a.startDate || a.date));
        const t = translations[currentLang];
        
        sorted.forEach((order) => {
            const tr = document.createElement('tr');
            let regionName = order.region === 'kharkiv' ? t.regKh : (order.region === 'mykolaiv' ? t.regMyk : order.region);
            let periodHtml = order.startDate ? `<div class="date-cell">${formatD(order.startDate)}<br>${formatD(order.endDate)}</div>` : (order.date || '-');
            let itemsHtml = ""; let itemsArr = order.items || [];
            
            itemsArr.forEach(item => {
                let typeTag = ""; let detailsStr = "";
                if (item.type === 'demining') {
                    typeTag = `<span class="tag demining">${t.typeDemining}</span>`;
                    let demTypesArr = item.deminingTypes || [];
                    let translatedTypes = demTypesArr.map(typeId => {
                        if (typeId === 'ts') return t.demTs; if (typeId === 'mc') return t.demMc; if (typeId === 'bac') return t.demBac; if (typeId === 'mdd') return t.demMdd; if (typeId === 'mech') return t.demMech; return typeId; 
                    });
                    let typesStr = translatedTypes.length > 0 ? translatedTypes.join(', ') : '-';
                    detailsStr = `<small style="color:#586069;"><b>${t.lblImsma}:</b> ${item.imsma || '-'} | <b>${t.lblType}:</b> ${typesStr}</small>`;
                } else if (item.type === 'nts') {
                    typeTag = `<span class="tag nts">${t.typeNts}</span>`;
                    let ntsName = t.ntsIn;
                    if(item.ntsSubType === 're_nts') ntsName = t.ntsRe; if(item.ntsSubType === 'demarcation') ntsName = t.ntsDemarc; if(item.ntsSubType === 'targeted') ntsName = t.ntsTarget;
                    let reportStatus = item.ntsReportSent ? t.reportYes : t.reportNo;
                    let cadastreHtml = (item.ntsSubType === 'targeted' && item.cadastres && item.cadastres.length > 0) ? `<br><b>${t.lblCads}:</b> ${item.cadastres.join(', ')}` : '';
                    detailsStr = `<small style="color:#586069;"><b>${t.lblSubtype}:</b> ${ntsName}<br><b>${t.lblStatus}:</b> ${reportStatus}${cadastreHtml}</small>`;
                } else if (item.type === 'eore') {
                    typeTag = `<span class="tag eore">${t.typeEore}</span>`;
                }
                itemsHtml += `<div class="poly-list-item"><strong>${item.polygon || '-'}</strong> ${typeTag}<br>${detailsStr}</div>`;
            });

            let html = `<td><strong>#${order.number}</strong><br><small style="color:#586069;">${regionName}</small></td><td>${periodHtml}</td><td>${itemsHtml}</td>`;
            if (isAdmin) {
                const realIndex = orders.indexOf(order); html += `<td class="admin-only"><button class="delete-btn" onclick="deleteOrder(${realIndex})">${t.deleteBtn}</button></td>`;
            }
            tr.innerHTML = html; tbody.appendChild(tr);
        });
    }

    function deleteOrder(index) { if(confirm("Видалити це розпорядження повністю?")) { orders.splice(index, 1); renderOrders(); saveToGitHub(); } }

    setLanguage(currentLang); loadData();
</script>
</body>
</html>
